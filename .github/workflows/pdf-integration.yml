name: PDF integration

on:
  pull_request:
    paths:
      - apps/etl/python/**
      - .github/workflows/pdf-integration.yml

jobs:
  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/etl/python/requirements.txt
      - name: Install CPU runtime and Docling
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r apps/etl/python/requirements.txt reportlab
      - name: Install Tesseract with Russian and English
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Convert digital and raster pages with real OCR
        run: python apps/etl/python/smoke.py
      - name: Check the alternative OCR backend
        run: python apps/etl/python/smoke.py tesseract
