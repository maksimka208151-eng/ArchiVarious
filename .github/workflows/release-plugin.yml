name: Release Obsidian plugin

# Obsidian requires the release tag to equal the manifest version exactly (e.g. 0.2.0, no "v" prefix).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches manifest version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm build:plugin
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/installer/go.mod
          cache: false
      - name: Build Windows installer
        run: pnpm build:installer
      - name: Zip for manual install
        run: |
          mkdir -p release/archivarious
          cp apps/obsidian-plugin/{main.js,manifest.json,styles.css} release/archivarious/
          (cd release && zip -r archivarious-plugin.zip archivarious)
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/obsidian-plugin/main.js
            apps/obsidian-plugin/manifest.json
            apps/obsidian-plugin/styles.css
            apps/installer/dist/ArchiVarious-installer.exe
            release/archivarious-plugin.zip
